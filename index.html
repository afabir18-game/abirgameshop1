<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abir Game Shop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding-bottom: 70px; }
        header { background-color: #0088cc; color: white; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; }
        .notice { background-color: #e0f2fe; color: #0369a1; padding: 10px; text-align: center; font-size: 14px; border-bottom: 1px solid #bae6fd; }
        .container { max-width: 600px; margin: 15px auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { font-size: 18px; margin-bottom: 12px; color: #333; border-bottom: 2px solid #0088cc; display: inline-block; padding-bottom: 3px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { border: 2px solid #e5e7eb; padding: 12px; border-radius: 6px; text-align: center; cursor: pointer; transition: 0.2s; }
        .card:hover, .card.selected { border-color: #0088cc; background-color: #f0f9ff; }
        .card .title { font-size: 14px; font-weight: bold; }
        .card .price { color: #0088cc; font-weight: bold; margin-top: 5px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #555; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .btn-buy { width: 100%; background-color: #0088cc; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-buy:hover { background-color: #006699; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); }
        .nav-item { text-align: center; font-size: 12px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

    <header>Abir Game Shop</header>

    <div class="notice">আমাদের সাইটে অর্ডার দিতে সমস্যা হলে হেল্পলাইনে যোগাযোগ করুন।</div>

    <div class="container">
        <h2>1. Select Recharge</h2>
        <div class="grid">
            <div class="card" onclick="selectPackage(this, 250)"><div class="title">50 Coin 🔥 Android</div><div class="price">BDT 250</div></div>
            <div class="card" onclick="selectPackage(this, 500)"><div class="title">100 Coin 🔥 Android</div><div class="price">BDT 500</div></div>
            <div class="card" onclick="selectPackage(this, 780)"><div class="title">750 Coin 🔥 Android</div><div class="price">BDT 780</div></div>
            <div class="card" onclick="selectPackage(this, 1040)"><div class="title">1040 Coin 🔥 Android</div><div class="price">BDT 1040</div></div>
        </div>

        <h2>2. Account Info</h2>
        <form id="orderForm" onsubmit="handleOrder(event)">
            <div class="form-group">
                <label>Account Type</label>
                <select id="accType" required>
                    <option value="KONAMI">KONAMI</option>
                    <option value="Facebook">Facebook</option>
                    <option value="Gmail">Gmail</option>
                </select>
            </div>
            <div class="form-group">
                <label>Email / User ID</label>
                <input type="text" id="userId" placeholder="Enter Email or ID" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="tel" id="whatsapp" placeholder="Your WhatsApp Number" required>
            </div>

            <h2>3. Payment Method</h2>
            <div class="form-group">
                <select id="paymentMethod" required>
                    <option value="bKash">bKash</option>
                    <option value="Nagad">Nagad</option>
                    <option value="Rocket">Rocket</option>
                </select>
            </div>

            <button type="submit" class="btn-buy">Buy Now</button>
        </form>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item">Home</a>
        <a href="#" class="nav-item">My Orders</a>
        <a href="#" class="nav-item">Add Money</a>
        <a href="#" class="nav-item">My Account</a>
    </div>

    <script>
        let selectedPrice = 0;
        let selectedPackageName = "";

        function selectPackage(element, price) {
            let cards = document.querySelectorAll('.card');
            cards.forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            selectedPrice = price;
            selectedPackageName = element.querySelector('.title').innerText;
        }

        function handleOrder(event) {
            event.preventDefault();
            if (selectedPrice === 0) {
                alert("অনুগ্রহ করে একটি প্যাকেজ নির্বাচন করুন।");
                return;
            }

            let accType = document.getElementById('accType').value;
            let userId = document.getElementById('userId').value;
            let password = document.getElementById('password').value;
            let whatsapp = document.getElementById('whatsapp').value;
            let paymentMethod = document.getElementById('paymentMethod').value;

            // আপনার হোয়াটসঅ্যাপ নম্বর (৮৮০ সহ বসানো হয়েছে)
            let myWhatsAppNumber = "8801948834941"; 

            let message = `*--- নতুন অর্ডার এসেছে ---*%0A` +
                          `*Package:* ${selectedPackageName}%0A` +
                          `*Price:* BDT ${selectedPrice}%0A` +
                          `*Account Type:* ${accType}%0A` +
                          `*User ID:* ${userId}%0A` +
                          `*Password:* ${password}%0A` +
                          `*Customer WhatsApp:* ${whatsapp}%0A` +
                          `*Payment Method:* ${paymentMethod}`;

            let whatsappUrl = `https://api.whatsapp.com/send?phone=${myWhatsAppNumber}&text=${message}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
